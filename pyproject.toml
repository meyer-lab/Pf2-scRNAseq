[project]
name = "pf2rnaseq"
version = "0.1.0"
description = "Single cell analysis across conditions using PARAFAC2."
authors = [{name = "Andrew Ramirez"}, {name = "Aaron Meyer", email = "git@asmlab.org" }]
license = "MIT"
readme = "README.md"
requires-python = ">= 3.12"

dependencies = [
    "numpy>=2.1",
    "scipy>=1.15",
    "scikit-learn>=1.6",
    "seaborn>=0.13.2",
    "pandas>=2.2",
    "tensorly>=0.8.1",
    "h5netcdf>=1.3",
    "anndata>=0.10.3",
    "datashader>=0.18",
    "gseapy>=1.1",
    "scanpy @ git+https://github.com/scverse/scanpy.git@c2a7a4b7ec3203121a8d75aa05fbeb602ceecbd4",
    "pacmap>=0.7.1",
    "leidenalg>=0.10.1",
    "tqdm>=4.66.1",
    "tlviz>=0.1.1",
    "statsmodels>=0.14.1",
    "dask[dataframe]>=2025",
    "ipykernel>=6.29.5",
    "parafac2 @ git+https://github.com/meyer-lab/parafac2.git",
    "wandb>=0.19.9",
    "doubletdetection>=4.3.0.post1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pyright>=1.1",
]

[project.scripts]
fbuild = "pf2rnaseq.figures.common:genFigure"
factor = "pf2rnaseq.imports:factorSave"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["pf2rnaseq"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Unused arguments
    "ARG",
]
